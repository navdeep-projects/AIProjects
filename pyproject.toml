    "docx2txt>=0.9",
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.4.0",
    "jq>=1.12.0",
    "langchain>=1.4.3",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-experimental>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.7",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.13",
    "langgraph-supervisor>=0.0.31",
    "langsmith>=0.14.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pdfminer>=20191125",
    "portalocker>=4.4.1",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "requests",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.1.0",
    "streamlit",
    "tensorflow>=2.22.0rc0",
    "tiktoken>=0.14.0",
    "truststore>=0.10.4",
    "unstructured>=0.27.16",
    "wikipedia>=1.4.0",
